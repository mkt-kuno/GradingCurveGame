<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒度分布ゲーム ～土質工学スイカゲーム～</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  color: #eee;
  font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 15px;
  overflow-y: auto;
}
#app {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}
#game-section { position: relative; }
#game-canvas {
  border-radius: 10px;
  display: block;
  cursor: crosshair;
}
#game-over {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  border-radius: 10px;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
}
#game-over h2 { font-size: 40px; color: #e94560; }
#game-over p { font-size: 18px; color: #ccc; }
#game-over button {
  padding: 12px 36px;
  font-size: 18px;
  background: #e94560;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}
#game-over button:hover { background: #c0392b; }
#info-section {
  width: 310px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel {
  background: #16213e;
  border-radius: 10px;
  padding: 14px;
}
.panel h3 {
  font-size: 12px;
  color: #e94560;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
#score-value {
  font-size: 36px;
  font-weight: bold;
  color: #f7dc6f;
}
#next-preview {
  display: flex;
  align-items: center;
  gap: 12px;
}
#next-canvas { border-radius: 6px; }
#next-name { font-size: 16px; color: #ddd; }
#merge-count { font-size: 12px; color: #888; margin-top: 4px; }
#model-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
#model-buttons button {
  flex: 1;
  padding: 8px 0;
  font-size: 13px;
  font-weight: bold;
  border: 2px solid #2a3a5e;
  background: transparent;
  color: #888;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
#model-buttons button.active {
  border-color: #e94560;
  color: #e94560;
  background: rgba(233,69,96,0.1);
}
#model-buttons button:hover { border-color: #e94560; }
#chk-forces {
  accent-color: #e94560;
  margin-right: 6px;
}
#chk-wrap {
  display: flex;
  align-items: center;
  font-size: 13px;
  color: #aaa;
  cursor: pointer;
}
#chart-canvas {
  display: block;
  border-radius: 6px;
  width: 100%;
}
#grading-params {
  font-size: 11px;
  color: #aaa;
  margin-top: 8px;
  line-height: 1.6;
  white-space: pre-line;
}
#controls-panel p {
  font-size: 12px;
  color: #888;
  line-height: 1.8;
}
@media (max-width: 800px) {
  #app { flex-direction: column; align-items: center; }
  #game-canvas { max-width: 100vw; height: auto; }
  #info-section { width: 100%; max-width: 450px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="game-section">
    <canvas id="game-canvas" width="450" height="700"></canvas>
    <div id="game-over">
      <h2>GAME OVER</h2>
      <p>最終スコア: <span id="final-score">0</span></p>
      <button id="restart-btn">もう一度</button>
    </div>
  </div>
  <div id="info-section">
    <div class="panel">
      <h3>スコア</h3>
      <div id="score-value">0</div>
      <div id="merge-count">合体回数: 0</div>
    </div>
    <div class="panel">
      <h3>次の粒子</h3>
      <div id="next-preview">
        <canvas id="next-canvas" width="60" height="60"></canvas>
        <span id="next-name"></span>
      </div>
    </div>
    <div class="panel">
      <h3>接触モデル (Contact Model)</h3>
      <div id="model-buttons">
        <button id="btn-hooke">Hooke</button>
        <button id="btn-hertz" class="active">Hertz</button>
      </div>
      <label id="chk-wrap">
        <input type="checkbox" id="chk-forces">
        力の連鎖を表示 (Force Chains)
      </label>
    </div>
    <div class="panel">
      <h3>粒径加積曲線 (Grading Curve)</h3>
      <canvas id="chart-canvas" width="282" height="200"></canvas>
      <div id="grading-params"></div>
    </div>
    <div class="panel" id="controls-panel">
      <h3>操作方法</h3>
      <p>
        マウス/タッチ: 位置決め<br>
        クリック/タップ: ドロップ<br>
        ← → / A D: 左右移動<br>
        スペース: ドロップ
      </p>
    </div>
  </div>
</div>
<script src="dist/game.js"></script>
</body>
</html>
