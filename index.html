<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒度分布ゲーム ～土質工学スイカゲーム～</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#eee;font-family:'Segoe UI','Helvetica Neue',sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:12px;overflow-y:auto}
#app{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start;max-width:1500px}
#left-panel{width:490px;display:flex;flex-direction:column;gap:12px}
#game-section{position:relative}
#game-canvas{border-radius:12px;display:block;cursor:crosshair}
#game-over{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);border-radius:12px;flex-direction:column;justify-content:center;align-items:center;gap:16px}
#game-over h2{font-size:46px;color:#e94560}
#game-over p{font-size:22px;color:#ccc}
#game-over button{padding:14px 44px;font-size:22px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer}
#game-over button:hover{background:#c0392b}
#right-panel{width:320px;display:flex;flex-direction:column;gap:12px}
.panel{background:#16213e;border-radius:12px;padding:16px}
.panel h3{font-size:13px;color:#e94560;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
#score-value{font-size:42px;font-weight:bold;color:#f7dc6f}
#merge-count{font-size:13px;color:#888;margin-top:4px}
#next-preview{display:flex;align-items:center;gap:12px}
#next-canvas{border-radius:6px}
#next-name{font-size:18px;color:#ddd}
#model-buttons{display:flex;gap:8px;margin-bottom:10px}
#model-buttons button{flex:1;padding:9px 0;font-size:14px;font-weight:bold;border:2px solid #2a3a5e;background:transparent;color:#888;border-radius:6px;cursor:pointer;transition:all .2s}
#model-buttons button.active{border-color:#e94560;color:#e94560;background:rgba(233,69,96,.1)}
#model-buttons button:hover{border-color:#e94560}
#chk-wrap{display:flex;align-items:center;font-size:14px;color:#aaa;cursor:pointer}
#chk-forces{accent-color:#e94560;margin-right:8px}
#chart-canvas{display:block;border-radius:8px;width:100%}
#grading-params{font-size:12px;color:#aaa;margin-top:8px;line-height:1.7;white-space:pre-line}
#controls-panel p{font-size:13px;color:#888;line-height:1.9}
@media(max-width:1100px){#app{flex-direction:column;align-items:center}#left-panel,#right-panel{width:100%;max-width:660px}}
</style>
</head>
<body>
<div id="app">
  <div id="left-panel">
    <div class="panel">
      <h3>粒径加積曲線 (Grading Curve)</h3>
      <canvas id="chart-canvas" width="460" height="450"></canvas>
      <div id="grading-params"></div>
    </div>
  </div>
  <div id="game-section">
    <canvas id="game-canvas" width="650" height="700"></canvas>
    <div id="game-over">
      <h2>GAME OVER</h2>
      <p>最終スコア: <span id="final-score">0</span></p>
      <button id="restart-btn">もう一度</button>
    </div>
  </div>
  <div id="right-panel">
    <div class="panel">
      <h3>スコア</h3>
      <div id="score-value">0</div>
      <div id="merge-count">合体回数: 0</div>
    </div>
    <div class="panel">
      <h3>次の粒子</h3>
      <div id="next-preview">
        <canvas id="next-canvas" width="70" height="70"></canvas>
        <span id="next-name"></span>
      </div>
    </div>
    <div class="panel">
      <h3>接触モデル</h3>
      <div id="model-buttons">
        <button id="btn-hooke" class="active">Hooke</button>
        <button id="btn-hertz">Hertz</button>
      </div>
      <label id="chk-wrap">
        <input type="checkbox" id="chk-forces">
        力の連鎖表示
      </label>
    </div>
    <div class="panel" id="controls-panel">
      <h3>操作方法</h3>
      <p>マウス/タッチ: 位置決め<br>クリック/タップ: ドロップ<br>← → / A D: 移動<br>スペース: ドロップ</p>
    </div>
  </div>
</div>
<script src="dist/game.js"></script>
</body>
</html>
